services:
  dpm-server:
    image: dpm-runtime
    container_name: dpm-server
    hostname: dpm-server

    environment:
      DPM_PROPERTIES_FILE: /etc/dpm/dpm.properties

    volumes:
      - ./config/dpm.properties:/etc/dpm/dpm.properties:ro
      - ./security:/etc/dpm/security:ro
      - ./logs/server:/var/log/dpm

    command: ["dpm_server", "-f"]

    networks:
      dpm-net:
        ipv4_address: 172.28.0.10

    ports:
      - "32042:32042"

  dpm-agent1:
    image: dpm-runtime
    container_name: dpm-agent1
    hostname: dpm-agent1

    environment:
      DPM_PROPERTIES_FILE: /etc/dpm/dpm.properties

    volumes:
      - ./config/dpm.properties:/etc/dpm/dpm.properties:ro
      - ./security:/etc/dpm/security:ro
      - ./logs/agent1:/var/log/dpm

    command: ["dpm_agentd", "-f"]

    depends_on:
      - dpm-server

    networks:
      dpm-net:
        ipv4_address: 172.28.0.11

networks:
  dpm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
